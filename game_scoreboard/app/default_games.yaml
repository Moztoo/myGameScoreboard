          - "Toad"
          - "Koopa Troopa"
          - "Shy Guy"
          - "Lakitu"
          - "Toadette"
          - "King Boo"
          - "Petey Piranha"
          - "Baby Mario"
          - "Baby Luigi"
          - "Baby Peach"
          - "Baby Daisy"
          - "Baby Rosalina"
          - "Metal Mario"
          - "Pink Gold Peach"
          - "Wiggler"
          - "Wario"
          - "Waluigi"
          - "Donkey Kong"
          - "Bowser"
          - "Dry Bones"
          - "Bowser Jr."
          - "Dry Bowser"
          - "Kamek"
