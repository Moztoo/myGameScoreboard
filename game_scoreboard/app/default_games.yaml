          - "Otro / Mii"
      - id: "kart"
        name: "Vehículo / Moto"
        type: "string"

  - id: "smash_bros"
    name: "Super Smash Bros. Ultimate"
    icon: "⚔️"
    description: "Combates competitivos y todos contra todos en Nintendo Switch."
    scoring_type: "placement"
    default_points_system: [10, 6, 3, 1]
    match_types:
      - "1v1 Competitivo (3 stocks)"
      - "Todos contra todos (4P)"
      - "Batalla por equipos (2v2)"
    rule_settings:
      - id: "formato"
        name: "Formato"
        type: "select"
        default: "Vidas (Stocks)"
        match_types:
          - "Todos contra todos (4P)"
          - "Batalla por equipos (2v2)"
        options:
          - "Vidas (Stocks)"
          - "Tiempo"
          - "Energía (Stamina)"
      - id: "vidas"
        name: "Cantidad de Vidas"
        type: "select"
        default: "3 vidas"
        options:
          - "2 vidas"
          - "3 vidas"
          - "4 vidas"
          - "5 vidas"
      - id: "fuego_amigo"
        name: "Ataque entre Aliados"
        type: "select"
        default: "Activado"
        match_types:
          - "Batalla por equipos (2v2)"
        options:
          - "Activado"
          - "Desactivado"
      - id: "objetos"
        name: "Objetos"
        type: "select"
        default: "Desactivados"
        match_types:
          - "Todos contra todos (4P)"
          - "Batalla por equipos (2v2)"
        options:
          - "Desactivados"
          - "Pocos"
          - "Medios"
          - "Muchos"
      - id: "escenarios"
        name: "Forma de Escenario"
        type: "select"
        default: "Campo de batalla"
        options:
          - "Campo de batalla"
          - "Destino Final"
          - "Normales"
    player_metrics:
      - id: "character"
        name: "Luchador"
        type: "string"
      - id: "stocks_left"
        name: "Vidas restantes"
        type: "number"
      - id: "damage_dealt"
        name: "Daño infligido %"
        type: "number"

  - id: "ea_fc"
    name: "EA Sports FC / FIFA"
    icon: "⚽"
    description: "Fútbol competitivo 1v1 o cooperativo."
    scoring_type: "points_high"
    default_points_system: [3, 1, 0]
    match_types:
      - "Partido 1v1"
      - "Partido 2v2"
    rule_settings:
      - id: "duracion_tiempo"
        name: "Duración de Tiempo"
        type: "select"
        default: "6 minutos"
        options:
          - "4 minutos"
          - "5 minutos"
          - "6 minutos"
          - "7 minutos"
          - "8 minutos"
      - id: "desempate"
        name: "Desempate"
        type: "select"
        default: "Prórroga y Penales"
        options:
          - "Prórroga y Penales"
          - "Directo a Penales"
          - "Gol de Oro"
          - "Empate"
      - id: "dificultad"
        name: "Dificultad IA"
        type: "select"
        default: "Clase mundial"
        match_types:
          - "Partido 2v2"
        options:
          - "Profesional"
          - "Clase mundial"
          - "Leyenda"
    player_metrics:
      - id: "team"
        name: "Equipo"
        type: "string"
      - id: "goals"
        name: "Goles"
        type: "number"

  - id: "halo_infinite"
    name: "Halo Infinite / Shooters"
    icon: "🎯"
    description: "Duelos y partidas multijugador en arena."
    scoring_type: "points_high"
    default_points_system: [10, 7, 5, 3]
    match_types:
      - "Asesino (Slayer)"
      - "Captura la bandera"
      - "SWAT"
    rule_settings:
      - id: "mapa"
        name: "Mapa"
        type: "string"
        default: "Aleatorio"
      - id: "meta_puntos"
        name: "Meta de Bajas"
        type: "select"
        default: "50 bajas"
        match_types:
          - "Asesino (Slayer)"
          - "SWAT"
        options:
          - "25 bajas"
          - "50 bajas"
          - "100 bajas"
      - id: "banderas_meta"
        name: "Banderas para Ganar"
        type: "select"
        default: "3 banderas"
        match_types:
          - "Captura la bandera"
        options:
          - "3 banderas"
          - "5 banderas"
      - id: "arma_inicial"
        name: "Arma Inicial"
        type: "select"
        default: "BR75 Battle Rifle"
        match_types:
          - "SWAT"
        options:
          - "BR75 Battle Rifle"
          - "VK78 Commando"
          - "Sidekick Pistol"
    player_metrics:
      - id: "kills"
        name: "Bajas (Kills)"
        type: "number"
      - id: "deaths"
        name: "Muertes"
        type: "number"
      - id: "assists"
        name: "Asistencias"
        type: "number"
